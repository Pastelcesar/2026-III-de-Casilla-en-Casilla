<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Pregunta</title>
</head>
<body>
    <h1>¿Eliminar Pregunta?</h1>
    <p>¿Estás seguro que deseas eliminar la pregunta: <strong>"{{ object.texto_pregunta }}"</strong>?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a href="{% url 'lista_preguntas' %}">Cancelar</a>
    </form>
</body>
</html>
